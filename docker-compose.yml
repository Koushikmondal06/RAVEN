services:
  # No `contributor` service on purpose. The daemon delivers the microVM tier with Firecracker, which
  # needs /dev/kvm, root-level tap networking, and host binaries this repo's image doesn't carry —
  # making it work in a container would take --privileged plus the Docker socket, i.e. full host root,
  # which is exactly what the isolation is supposed to prevent. Contributors run it natively:
  #   sudo bash contributor/scripts/setup-firecracker.sh && sudo -E npm run contributor
  # See contributor/README.md.
  #
  # compose validates EVERY service's env_file at load, even ones you don't start. On Compose v2 you
  # could mark these `required: false`; on v1 they must exist, so create both once:
  #   for d in backend example-buyer; do cp $d/.env.example $d/.env; done
  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: backend/.env
    ports: ['4000:4000']

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      # NEXT_PUBLIC_* are baked in at build time. These interpolate from the shell / --env-file, so
      # for a custom build: docker compose --env-file web/.env build web
      args:
        NEXT_PUBLIC_REGISTRY_URL: ${NEXT_PUBLIC_REGISTRY_URL:-http://localhost:4000}
        NEXT_PUBLIC_SOLANA_RPC_URL: ${NEXT_PUBLIC_SOLANA_RPC_URL:-https://api.devnet.solana.com}
        NEXT_PUBLIC_SOLANA_CLUSTER: ${NEXT_PUBLIC_SOLANA_CLUSTER:-devnet}
        MAINNET: ${MAINNET:-false}
    ports: ['3000:80']

  buyer:
    build: { context: ., dockerfile: example-buyer/Dockerfile }
    env_file: example-buyer/.env
