services:
  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: .env
    ports: ['4000:4000']

  contributor:
    build: { context: ., dockerfile: contributor/Dockerfile }
    env_file: .env # needs RAVEN_KEY (from the /contributor page) + REGISTRY_URL
    # Sandboxes run as sibling containers on the host daemon — nothing extra to install.
    volumes: ['/var/run/docker.sock:/var/run/docker.sock']
    # Only needed for TUNNEL_MODE=local (and broken on Docker Desktop — run natively there instead).
    # network_mode: host

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      # NEXT_PUBLIC_* are baked in at build time — set them in .env before building.
      args:
        NEXT_PUBLIC_PRIVY_APP_ID: ${NEXT_PUBLIC_PRIVY_APP_ID:-}
        NEXT_PUBLIC_REGISTRY_URL: ${NEXT_PUBLIC_REGISTRY_URL:-http://localhost:4000}
        NEXT_PUBLIC_SOLANA_RPC_URL: ${NEXT_PUBLIC_SOLANA_RPC_URL:-https://api.devnet.solana.com}
        NEXT_PUBLIC_SOLANA_CLUSTER: ${NEXT_PUBLIC_SOLANA_CLUSTER:-devnet}
    ports: ['3000:80']

  buyer:
    build: { context: ., dockerfile: example-buyer/Dockerfile }
    env_file: .env
