services:
  # compose validates EVERY service's env_file at load, even ones you don't start. On Compose v2 you
  # could mark these `required: false`; on v1 they must exist, so create all three once:
  #   for d in backend contributor example-buyer; do cp $d/.env.example $d/.env; done
  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: backend/.env
    ports: ['4000:4000']

  # Private tunnel relay. Every lease's SSH port is published through this instead of the public
  # bore.pub, so buyer traffic never transits a third party. 7835 is bore's fixed control port; the
  # 20000-20100 range is what it hands out to tunnels, so both must be reachable from the internet.
  # BORE_SECRET gates who may open a tunnel — set it in backend/.env; the registry passes it to each
  # authenticated daemon at register time, so it is never published in the web bundle.
  bore:
    image: ekzhang/bore
    # BORE_SECRET comes from backend/.env — bore reads it from the environment, so it is never a
    # compose ${interpolation} (those resolve from the shell, not from env_file, and a missing one
    # would fail every service in this file).
    env_file: backend/.env
    command: server --min-port 20000 --max-port 20100
    ports: ['7835:7835', '20000-20100:20000-20100']
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      # NEXT_PUBLIC_* are baked in at build time. These interpolate from the shell / --env-file, so
      # for a custom build: docker compose --env-file web/.env build web
      args:
        # Default to the same-origin /api path that this image's nginx proxies to the backend service.
        # An absolute http:// URL here is what breaks a deployment behind https: the bundle is static,
        # so `localhost:4000` means the visitor's own machine and any plain-http URL is blocked as
        # mixed content. Only override this when the registry is on its own https host.
        NEXT_PUBLIC_REGISTRY_URL: ${NEXT_PUBLIC_REGISTRY_URL:-/api}
        NEXT_PUBLIC_SOLANA_RPC_URL: ${NEXT_PUBLIC_SOLANA_RPC_URL:-https://api.devnet.solana.com}
        NEXT_PUBLIC_SOLANA_CLUSTER: ${NEXT_PUBLIC_SOLANA_CLUSTER:-devnet}
        MAINNET: ${MAINNET:-false}
    # No depends_on: the backend often lives on another host, and nginx resolves `backend` per request
    # (see web/nginx.conf) so this image starts either way.
    ports: ['3000:80']

  # Share this machine's compute. Each lease runs as a SIBLING container on the host Docker daemon,
  # which is what the socket mount is for — and why this container effectively has host root. Run it
  # on a machine you're willing to hand to strangers.
  contributor:
    build: { context: ., dockerfile: contributor/Dockerfile }
    env_file: contributor/.env
    volumes: ['/var/run/docker.sock:/var/run/docker.sock']
    restart: unless-stopped

  buyer:
    build: { context: ., dockerfile: example-buyer/Dockerfile }
    env_file: example-buyer/.env
