server {
  listen 80;
  root /usr/share/nginx/html;

  # The registry, reverse-proxied on the web app's own origin. Two problems this solves at once:
  # the bundle's NEXT_PUBLIC_REGISTRY_URL is baked at build time, so a `http://localhost:4000` value
  # points at the *visitor's* machine; and any plain-http registry URL is blocked as mixed content
  # once the page itself is served over https. With NEXT_PUBLIC_REGISTRY_URL=/api both disappear —
  # same origin, same scheme, no CORS.
  location /api/ {
    # Docker's embedded DNS, resolved per request: the image still starts when no `backend` service
    # exists (a static-name upstream would fail nginx startup with "host not found in upstream").
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $registry http://backend:4000;
    rewrite ^/api/(.*)$ /$1 break; # registry routes live at the root: /auth/nonce, /wallet, /leases
    proxy_pass $registry;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Static export: a route like /contributor emits BOTH contributor.html (the page) and a contributor/
  # dir (RSC segment .txt files). Try $uri.html BEFORE $uri so /contributor serves contributor.html
  # instead of matching the directory and falling through to the root index.html.
  location / {
    try_files $uri.html $uri $uri/index.html /index.html;
  }
}
