services:
  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: .env
    ports: ['4000:4000']

  contributor:
    build: { context: ., dockerfile: contributor/Dockerfile }
    env_file: .env
    # Sandboxes run as sibling containers on the host daemon — nothing extra to install.
    volumes: ['/var/run/docker.sock:/var/run/docker.sock']
    # Only needed for TUNNEL_MODE=local (and broken on Docker Desktop — run natively there instead).
    # network_mode: host

  buyer:
    build: { context: ., dockerfile: example-buyer/Dockerfile }
    env_file: .env
